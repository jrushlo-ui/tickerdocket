name: Collect publisher wire feeds
on:
  schedule:
    - cron: '6,26,46 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-feeds.yml'
      - 'collect-wire-feeds.mjs'
permissions:
  contents: read
  id-token: write
concurrency:
  group: tickerdocket-wire-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send current publisher feed observations
        run: node collect-wire-feeds.mjs
